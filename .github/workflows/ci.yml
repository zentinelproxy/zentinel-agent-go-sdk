# Build, vet and test the SDK on every push and pull request.
#
# This repository had no CI at all: it ships a Go SDK that downstream users
# build against, and nothing verified it compiled. The steps below are the ones
# that were already passing locally when this was added — the intent is a gate
# that stays green and therefore stays meaningful, not a broad net that goes
# red and gets ignored.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          # Tracks the version in go.mod rather than pinning separately, so
          # the two cannot drift.
          go-version-file: go.mod
          cache: true

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race ./...

  formatting:
    name: Formatting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Check gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-formatted:"
            echo "$unformatted"
            echo
            echo "Run: gofmt -w ."
            exit 1
          fi

  conformance:
    # Unit tests passed here for months while no agent built with this SDK
    # could complete a handshake with the proxy (zentinel#600). This job runs
    # the shared conformance harness: a real zentinel binary, a fixture
    # upstream, and this SDK's agents on the Unix socket and gRPC transports.
    name: Conformance (agent protocol v2)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build the agents
        run: |
          go build -o "$RUNNER_TEMP/conformance-agent" ./examples/conformance
          go build -o "$RUNNER_TEMP/hello-agent" ./examples/hello

      # The configure check needs zentinel#603, which no release includes
      # yet, so zentinel is built from main. Switch to
      # `zentinel-version: <first release with #603>` once it ships.
      - name: Conformance agent (UDS + gRPC)
        uses: zentinelproxy/zentinel/sdk-conformance@sdk/conformance-harness
        with:
          zentinel-ref: main
          agent-command: ${{ runner.temp }}/conformance-agent --socket {socket}
          grpc-agent-command: ${{ runner.temp }}/conformance-agent --grpc {grpc}

      - name: README quick-start agent
        uses: zentinelproxy/zentinel/sdk-conformance@sdk/conformance-harness
        with:
          zentinel-ref: main
          profile: hello
          agent-command: ${{ runner.temp }}/hello-agent --socket {socket}
